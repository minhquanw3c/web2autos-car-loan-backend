name: Deploy to Production

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Navigated to project folder"
            cd ${{ secrets.REPOSITORY_PATH }}

            echo "Pulling latest changes..."
            git pull origin master

            echo "Installing Server dependencies..."
            npm install

            echo "Building production..."
            npm run build

            echo "Refreshing outdated files"
            echo "[]" > ./src/data/vehicles.json

            echo "Restarting Node Server..."
            pm2 restart "web2autos-backend-api" || pm2 start ecosystem.config.cjs

            echo "✅ Deployment Success!"
